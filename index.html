<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Planejamento Reprodutivo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fffdfd;
      font-family: "Montserrat", Arial, sans-serif;
      color: #35105F;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 64px 24px 48px;
      overflow: hidden;
    }

    /* FORMAS ORGÂNICAS */

    .shape {
      position: absolute;
      border-radius: 50%;
      background: #F5E7FA;
      pointer-events: none;
      z-index: 0;
    }

    .shape-1 {
      width: 520px;
      height: 300px;
      top: -170px;
      left: -160px;
      transform: rotate(-12deg);
    }

    .shape-2 {
      width: 420px;
      height: 250px;
      right: -180px;
      top: 220px;
      opacity: .65;
      transform: rotate(20deg);
    }

    .shape-3 {
      width: 300px;
      height: 180px;
      left: -130px;
      bottom: 40px;
      background: #FBE5F1;
      opacity: .75;
    }

    /* CONTEÚDO */

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 auto;
      font-size: clamp(48px, 5.5vw, 86px);
      line-height: .90;
      letter-spacing: -0.055em;
      font-weight: 900;
      color: #4B087D;
    }

    h1 span {
      display: block;
      color: #F51675;
    }

    .subtitle {
      margin: 16px auto 0;
      font-size: clamp(16px, 1.5vw, 20px);
      line-height: 1.4;
      font-weight: 400;
      color: #35105F;
    }

    .accent {
      width: 52px;
      height: 5px;
      margin: 18px auto 0;
      border-radius: 999px;
      background: #F51675;
    }

    /* VÍDEO */

    .video-wrapper {
      width: 100%;
      background: #F5E7FA;
      padding: 7px;
      border-radius: 22px;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
    }

    /* LEGENDA */

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #35105F;
      opacity: .65;
    }

    /* CRÉDITOS */

    .creditos {
      width: 100%;
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      text-align: center;
      align-items: start;
    }

    .credito-titulo {
      display: block;
      margin-bottom: 7px;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: .055em;
      color: #4B087D;
    }

    .credito-nome {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
      color: #35105F;
    }


    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 52px 16px 42px;
      }

      main {
        width: 100%;
        max-width: 100%;
      }

      header {
        width: 100%;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 9.6vw;
        line-height: .92;
        letter-spacing: -0.055em;
        white-space: nowrap;
      }

      h1 span {
        display: block;
      }

      .subtitle {
        max-width: 280px;
        margin-top: 20px;
        font-size: 16px;
        line-height: 1.4;
      }

      .accent {
        width: 44px;
        height: 4px;
        margin-top: 18px;
      }

      .video-wrapper {
        width: 100%;
        margin-top: 26px;
        padding: 5px;
        border-radius: 16px;
      }

      video {
        border-radius: 12px;
      }

      footer {
        margin-top: 18px;
        padding: 0 8px;
        font-size: 11px;
        line-height: 1.45;
      }

      /* CRÉDITOS NO CELULAR */

      .creditos {
        grid-template-columns: repeat(2, 1fr);
        gap: 26px 16px;
        margin-top: 30px;
        padding: 0 8px;
      }

      .credito-titulo {
        margin-bottom: 6px;
        font-size: 9px;
        line-height: 1.25;
      }

      .credito-nome {
        font-size: 12px;
        line-height: 1.35;
      }

      /* FORMAS MAIS DISCRETAS NO CELULAR */

      .shape-1 {
        width: 300px;
        height: 180px;
        top: -90px;
        left: -140px;
      }

      .shape-2 {
        width: 240px;
        height: 160px;
        right: -140px;
        top: 390px;
      }

      .shape-3 {
        width: 230px;
        height: 140px;
        left: -130px;
        bottom: 30px;
      }
    }

  </style>
</head>


<body>

  <div class="page">

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <main>

      <header>

        <h1>
          PLANEJAMENTO
          <span>REPRODUTIVO</span>
        </h1>

        <p class="subtitle">
          Informação para escolhas conscientes.
        </p>

        <div class="accent"></div>

      </header>


      <div class="video-wrapper">

        <video controls playsinline preload="metadata">
          <source src="planejamento-reprodutivo.mp4" type="video/mp4">
          Seu navegador não suporta a reprodução deste vídeo.
        </video>

      </div>


      <footer>
        Material educativo sobre planejamento reprodutivo.
      </footer>


      <section class="creditos">

        <div class="credito">
          <span class="credito-titulo">AUTORA</span>
          <p class="credito-nome">Marcela P. S. Mello</p>
        </div>

        <div class="credito">
          <span class="credito-titulo">ORIENTADORA</span>
          <p class="credito-nome">Helaine Oliveira</p>
        </div>

        <div class="credito">
          <span class="credito-titulo">CO-ORIENTADORA</span>
          <p class="credito-nome">Vanessa Seabra</p>
        </div>

        <div class="credito">
          <span class="credito-titulo">DESIGN E PRODUÇÃO</span>
          <p class="credito-nome">Filipe Miguel</p>
        </div>

      </section>

    </main>

  </div>

</body>

</html>
