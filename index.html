<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Planejamento Reprodutivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fffdfd;
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      color: #35105F;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 70px 24px 50px;
      overflow: hidden;
    }

    /* Formas orgânicas discretas da identidade visual */
    .shape {
      position: absolute;
      border-radius: 50%;
      background: #F5E7FA;
      z-index: 0;
      pointer-events: none;
    }

    .shape-1 {
      width: 520px;
      height: 300px;
      top: -170px;
      left: -160px;
      transform: rotate(-12deg);
    }

    .shape-2 {
      width: 420px;
      height: 250px;
      right: -180px;
      top: 220px;
      opacity: .65;
      transform: rotate(20deg);
    }

    .shape-3 {
      width: 300px;
      height: 180px;
      left: -130px;
      bottom: 40px;
      background: #FBE5F1;
      opacity: .75;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 76px);
      line-height: .9;
      letter-spacing: -3px;
      font-weight: 900;
      color: #4B087D;
    }

    h1 span {
      display: block;
      color: #F51675;
    }

    .subtitle {
      margin: 22px auto 0;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.4;
      color: #35105F;
    }

    .accent {
      width: 52px;
      height: 5px;
      margin: 24px auto 0;
      border-radius: 999px;
      background: #F51675;
    }

    .video-wrapper {
      width: 100%;
      background: #F5E7FA;
      padding: 9px;
      border-radius: 24px;
    }

    video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 17px;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #35105F;
      opacity: .65;
    }

    @media (max-width: 600px) {
      .page {
        padding: 48px 16px 34px;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        font-size: clamp(39px, 12vw, 58px);
        letter-spacing: -2px;
      }

      .subtitle {
        max-width: 280px;
      }

      .video-wrapper {
        padding: 6px;
        border-radius: 16px;
      }

      video {
        border-radius: 11px;
      }
    }
 /* Ajustes para celular */
@media (max-width: 600px) {

  body {
    padding: 36px 18px;
    min-height: 100vh;
  }

  main {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(42px, 12vw, 64px);
    line-height: 0.9;
    letter-spacing: -2px;
    width: 100%;
    max-width: 100%;
    overflow-wrap: normal;
  }

  h1 span {
    display: block;
  }

  .intro {
    font-size: 20px;
    line-height: 1.35;
    max-width: 330px;
    margin-left: auto;
    margin-right: auto;
  }

  .video {
    width: 100%;
    margin-top: 32px;
  }

  video {
    display: block;
    width: 100%;
    height: auto;
  }

  .info {
    font-size: 15px;
    line-height: 1.4;
    margin-top: 24px;
  }
} </style>
</head>

<body>

  <div class="page">

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <main>

      <header>
        <h1>
          PLANEJAMENTO
          <span>REPRODUTIVO</span>
        </h1>

        <p class="subtitle">
          Informação para escolhas conscientes.
        </p>

        <div class="accent"></div>
      </header>

      <div class="video-wrapper">
        <video controls playsinline preload="metadata">
          <source src="planejamento-reprodutivo.mp4" type="video/mp4">
          Seu navegador não suporta a reprodução deste vídeo.
        </video>
      </div>

      <footer>
        Material educativo sobre planejamento reprodutivo.
      </footer>

    </main>

  </div>

</body>
</html>
